<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Idea Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main page heading -->
    <h1>AI Business Idea Validator</h1>

    <!-- Short description about the website -->
    <p>
        This website analyzes startup ideas and helps you check whether they have potential.
    </p>

    <!-- Input area where the user enters their startup idea -->
    <label for="startupIdea">Enter your startup idea:</label>
    <textarea id="startupIdea" name="startupIdea" rows="6" cols="50" placeholder="Describe your business idea here..."></textarea>

    <!-- Button to trigger idea validation later -->
    <button id="validateButton" type="button">Validate My Idea</button>

    <!-- Empty section for future analysis results -->
    <section id="resultsSection" aria-live="polite">
        <!-- Results will appear here later -->
    </section>
</body>
</html>
